name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Установка Java 17 через официальный экшен
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2. Установка Android SDK через системный менеджер
    #    (Этот способ работает, но мы не используем его для Java)
    - name: Install Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install android-sdk -y
        mkdir -p $HOME/android-sdk
        sudo cp -r /usr/lib/android-sdk/* $HOME/android-sdk/
        sudo chown -R $USER:$USER $HOME/android-sdk
        echo "sdk.dir=$HOME/android-sdk" > local.properties
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    # 3. Создание иконок (ваше решение)
    - name: Create app icons
      run: |
        cd app/src/main/res
        for size in 48 72 96 144 192; do
          mkdir -p mipmap-${size}
          convert -size ${size}x${size} xc:#3498db -gravity center -fill white -pointsize $((size/2)) -draw "text 0,0 'N'" mipmap-${size}/ic_launcher.png;
          cp mipmap-${size}/ic_launcher.png mipmap-${size}/ic_launcher_round.png;
        done
        cd /workspaces/NovikonApp # Возврат в корень (в Actions путь другой)
      # Важно: В GitHub Actions рабочий директорий - /home/runner/work/NovikonApp/NovikonApp
      # Поэтому корректируем пути
        cd /home/runner/work/NovikonApp/NovikonApp/app/src/main/res
        ls -la mipmap-*/ic_launcher.png

    # 4. Настройка Gradle с ПРАВИЛЬНЫМ путем к Java
    - name: Setup Gradle properties
      run: |
        echo "org.gradle.java.home=$JAVA_HOME_17_X64" >> gradle.properties
        echo "sdk.dir=$HOME/android-sdk" >> local.properties
        cat gradle.properties
        cat local.properties
      env:
        JAVA_HOME_17_X64: ${{ env.JAVA_HOME_17_X64 }}

    # 5. Сборка с выводом лога ошибок
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    # 6. Сохранение артефакта
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
