name: Update News JSON

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get news
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getUpdates?chat_id=-1003759098789&limit=20" > news.json
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news"
          git push
