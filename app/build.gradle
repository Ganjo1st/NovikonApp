plugins {
    id 'com.android.application'
}

android {
    namespace 'com.novikon.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.novikon.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        // Добавляем токен из переменной окружения
        buildConfigField "String", "BOT_TOKEN", "\"${System.getenv('BOT_TOKEN')}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.yandex.android:mobileads:7.14.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
