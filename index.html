<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>НОВИКОН</title>
    <style>
      body {
        margin: 0;
        background-color: #f8fbff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        background-color: #ffffff;
        border-bottom: 1px solid #e0e0e0;
      }
      .logo {
        display: flex;
        align-items: center;
        color: #0d47a1;
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
      }
      .logo img {
        height: 40px;
        margin-right: 12px;
      }
      button {
        background: transparent;
        border: 1px solid #ccc;
        padding: 5px 10px;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
      }
      main {
        max-width: 800px;
        margin: 0 auto;
        padding: 24px;
      }
      .news-card {
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .news-card img {
        width: 100%;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .news-card h2 {
        color: #0d47a1;
        margin: 0 0 8px 0;
      }
      .news-card p {
        color: #444;
        line-height: 1.6;
        margin: 0 0 12px 0;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #eee;
        padding-top: 14px;
        color: #666;
        font-size: 14px;
      }
      a.read-more {
        color: #1565c0;
        font-weight: bold;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/NovikonApp/" class="logo">
        <img src="/NovikonApp/logo.png" alt="Логотип">
        <span>НОВИКОН</span>
      </a>
      <button onclick="document.body.classList.toggle('dark')">🌙</button>
    </header>
    <main id="news-list"></main>
    <script>
      // Загружаем новости из JSON
      fetch('/NovikonApp/data/news.json')
        .then(res => res.json())
        .then(news => {
          const list = document.getElementById('news-list');
          news.forEach(article => {
            const card = document.createElement('div');
            card.className = 'news-card';
            
            // Картинка
            if (article.image_url) {
              const img = document.createElement('img');
              img.src = article.image_url;
              card.appendChild(img);
            }
            
            // Заголовок
            const title = document.createElement('h2');
            title.textContent = article.title;
            card.appendChild(title);
            
            // Текст
            const content = document.createElement('p');
            content.textContent = article.content;
            card.appendChild(content);
            
            // Дата и ссылка
            const footer = document.createElement('div');
            footer.className = 'footer';
            const date = document.createElement('span');
            date.textContent = article.published_at;
            const link = document.createElement('a');
            link.className = 'read-more';
            link.href = '/NovikonApp/article/' + article.id;
            link.textContent = 'Читать далее →';
            footer.appendChild(date);
            footer.appendChild(link);
            card.appendChild(footer);
            
            list.appendChild(card);
          });
        });
        
      // Переключатель темы
      document.querySelector('button').addEventListener('click', () => {
        document.body.classList.toggle('dark');
        if (document.body.classList.contains('dark')) {
          document.body.style.backgroundColor = '#121212';
          document.querySelector('header').style.backgroundColor = '#1e1e1e';
          document.querySelector('header').style.borderBottom = '1px solid #333';
          document.querySelector('.logo').style.color = '#4fc3f7';
          document.querySelectorAll('.news-card').forEach(card => {
            card.style.backgroundColor = '#1e1e1e';
            card.style.border = '1px solid #333';
          });
          document.querySelectorAll('.news-card h2').forEach(h => h.style.color = '#ffffff');
          document.querySelectorAll('.news-card p').forEach(p => p.style.color = '#b0b0b0');
        } else {
          document.body.style.backgroundColor = '#f8fbff';
          document.querySelector('header').style.backgroundColor = '#ffffff';
          document.querySelector('header').style.borderBottom = '1px solid #e0e0e0';
          document.querySelector('.logo').style.color = '#0d47a1';
          document.querySelectorAll('.news-card').forEach(card => {
            card.style.backgroundColor = '#ffffff';
            card.style.border = '1px solid #e0e0e0';
          });
          document.querySelectorAll('.news-card h2').forEach(h => h.style.color = '#0d47a1');
          document.querySelectorAll('.news-card p').forEach(p => p.style.color = '#444');
        }
      });
    </script>
  </body>
</html>
